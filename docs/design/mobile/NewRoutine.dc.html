<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New routine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Routines.dc.html" aria-label="Back to routines" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">New routine</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="r-name" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Name</label>
<input id="r-name" type="text" value="Morning digest" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="r-bot" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Which bot does it</label>
<select id="r-bot" style="height: 50px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
<option>Researcher (@researcher)</option>
<option>Accountant (@accountant)</option>
<option>Noter (@noter)</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #5C5C5C">Starts</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F6F5F2">
<button type="button" aria-pressed="true" style="height: 44px; border: none; border-radius: 10px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">On a schedule</button>
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; color: #5C5C5C; font-family: inherit; font-size: 15px; font-weight: 500">When something happens</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-label="{{d.name}}" aria-pressed="{{d.pressed}}" style="height: 44px; border: 1px solid {{d.line}}; border-radius: 10px; background: {{d.bg}}; color: {{d.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0">{{d.short}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<label for="r-time" style="font-size: 15px; flex-grow: 1">At</label>
<input id="r-time" type="time" value="08:30" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="r-prompt" style="font-size: 13px; font-weight: 500; color: #5C5C5C">What to do</label>
<textarea id="r-prompt" rows="3" style="box-sizing: border-box; padding: 12px 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; line-height: 23px; color: #171717; resize: none">Collect what changed overnight and send me a short summary.</textarea>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
<input id="r-notify" type="checkbox" checked style="width: 24px; height: 24px; flex-shrink: 0; accent-color: #171717">
<label for="r-notify" style="font-size: 15px; flex-grow: 1; padding: 12px 0">Notify me when it finishes</label>
</div>
<a href="Routines.dc.html" style="margin-top: auto; height: 54px; border-radius: 14px; background: #D4213D; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Create routine</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
var days = names.map(function (name, i) {
var on = i < 5;
return { name: name, short: name.slice(0, 2), pressed: on ? 'true' : 'false', line: on ? '#171717' : '#D9D6D0', bg: on ? '#171717' : '#FFFFFF', ink: on ? '#FFFFFF' : '#3D3D3D' };
});
return { days: days };
}
}
</script>
</body>
</html>
