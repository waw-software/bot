<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Memory.dc.html" aria-label="Back to memory" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-family: ui-monospace, Menlo, monospace; font-weight: 600; font-size: 17px">topics/expenses.md</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 10px; border-radius: 999px; background: #FCEBEE; font-size: 13px; font-weight: 500; color: #8C1427">Only Accountant</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #F6F5F2; font-size: 13px; color: #3D3D3D">Last changed by the bot</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px; background: #F6F5F2">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">DESCRIPTION</span>
<span style="font-size: 14px; line-height: 21px">How expense emails should be worded. The bot reads this line to decide whether to open the file.</span>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #E4E2DD; border-radius: 14px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-bottom: 1px solid #EEECE8">
<span style="font-size: 15px; line-height: 22px">{{f.text}}</span>
<span style="align-self: flex-start; padding: 3px 8px; border: 1px solid {{f.line}}; border-radius: 8px; font-size: 12px; font-weight: 500; color: {{f.ink}}">{{f.source}}</span>
</div>
</sc-for>
<button type="button" style="height: 50px; border: none; background: transparent; color: #171717; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Add a line</span>
</button>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 52px; border: 1px solid #D9D6D0; border-radius: 14px; background: #FFFFFF; color: #B01A31; font-family: inherit; font-size: 15px; font-weight: 600">Delete file</button>
<button type="button" style="height: 52px; border: none; border-radius: 14px; background: #171717; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">Edit as text</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var said = { source: 'You said', line: '#171717', ink: '#171717' };
var noticed = { source: 'Bot noticed', line: '#D9D6D0', ink: '#5C5C5C' };
var rows = [
['Keep expense emails to three sentences.', said],
['Always attach the receipt as a PDF.', said],
['Send to finance and copy the manager.', said],
['Receipts usually arrive from the ticket shop within a day.', noticed]
];
var facts = rows.map(function (r) {
return { text: r[0], source: r[1].source, line: r[1].line, ink: r[1].ink };
});
return { facts: facts };
}
}
</script>
</body>
</html>
