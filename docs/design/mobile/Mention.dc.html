<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call another bot with @</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 12px; border-bottom: 1px solid #EEECE8">
<a href="Threads.dc.html" aria-label="Back to threads" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #F6F5F2; color: #171717; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #1F7A4D"><svg viewBox="0 0 48 48" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="48" height="48" fill="#F1DFB8"></rect><circle cx="33" cy="16" r="7" fill="#E6A93C"></circle><path d="M0 34l12-12 10 9 8-6 18 14v9H0z" fill="#7C9A74"></path><path d="M0 40l14-9 12 7 10-5 12 8v7H0z" fill="#4E7A62"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Accountant</span>
<span style="font-size: 13px; color: #5C5C5C">@accountant · Expenses thread</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 0">
<div style="align-self: flex-end; max-width: 290px; padding: 12px 14px; border-radius: 18px 18px 4px 18px; background: #1F7A4D; color: #FFFFFF; font-size: 15px; line-height: 22px">When do I have to file the reimbursement?</div>
<div style="align-self: flex-start; max-width: 300px; padding: 12px 14px; border-radius: 18px 18px 18px 4px; background: #EEF6F1; font-size: 15px; line-height: 22px">Requests are due by the end of the month, with the receipt attached as a PDF.</div>
</div>
<div style="display: flex; flex-direction: column; margin: 0 16px; border: 1px solid #D9D6D0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(0,0,0,0.10)">
<span style="padding: 12px 14px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">CALL A BOT INTO THIS THREAD</span>
<sc-for list="{{bots}}" as="bot" hint-placeholder-count="5">
<a href="MentionResult.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; text-decoration: none; color: #171717; background: {{bot.bg}}">
<span aria-hidden="true" style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: {{bot.tile}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{bot.letter}}</span>
<span style="font-size: 15px; font-weight: 600">{{bot.name}}</span>
<span style="font-size: 14px; color: #5C5C5C">{{bot.handle}}</span>
<span style="margin-left: auto; font-size: 13px; color: #5C5C5C">{{bot.does}}</span>
</a>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 0">
<label for="composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Message Accountant</label>
<input id="composer" type="text" value="@no" style="flex-grow: 1; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #171717; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
<button type="button" aria-label="Send message" style="width: 50px; height: 50px; flex-shrink: 0; border: none; border-radius: 14px; background: #1F7A4D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var bots = [
{ name: 'Noter', handle: '@noter', does: 'Notes', letter: 'N', tile: '#5B3FB5', bg: '#F6F5F2' },
{ name: 'Commander', handle: '@commander', does: 'Routing', letter: 'C', tile: '#171717', bg: 'transparent' },
{ name: 'Planner', handle: '@planner', does: 'Calendar', letter: 'P', tile: '#B45309', bg: 'transparent' },
{ name: 'Researcher', handle: '@researcher', does: 'Web', letter: 'R', tile: '#8A5A00', bg: 'transparent' },
{ name: 'Coder', handle: '@coder', does: 'Code', letter: 'C', tile: '#1F5FBF', bg: 'transparent' }
];
return { bots: bots };
}
}
</script>
</body>
</html>
