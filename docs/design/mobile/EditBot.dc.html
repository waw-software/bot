<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize a bot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="BotTools.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #171717"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">Customize bot</h1>
<a href="BotTools.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Save</a>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 14px 18px; border-radius: 16px; background: #F6F5F2">
<div style="display: flex; align-items: center; gap: 18px">
<div aria-hidden="true" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 19px; overflow: hidden; background: #FFFFFF; color: #171717; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 0 2px #F6F5F2, 0 0 0 5px {{color}}"><sc-if value="{{isImage}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 48 48" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="48" height="48" fill="#F1DFB8"></rect><circle cx="33" cy="16" r="7" fill="#E6A93C"></circle><path d="M0 34l12-12 10 9 8-6 18 14v9H0z" fill="#7C9A74"></path><path d="M0 40l14-9 12 7 10-5 12 8v7H0z" fill="#4E7A62"></path></svg></sc-if><sc-if value="{{isIcon}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="{{previewD}}"></path></svg></sc-if><sc-if value="{{isEmoji}}" hint-placeholder-val="{{ false }}"><span style="line-height: 1">{{previewEmoji}}</span></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">Accountant</span><span style="font-size: 14px; color: #5C5C5C">@accountant · {{colorName}} threads</span></div>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; margin-left: -4px; padding: 10px; border-radius: 14px; background: #FFFFFF">
<span style="padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: {{tint}}; font-size: 13px">Draft is ready</span>
<span style="padding: 8px 12px; border-radius: 14px 14px 4px 14px; background: {{color}}; color: #FFFFFF; font-size: 13px">Send it</span>
<span style="margin-left: auto; padding: 8px 12px; border-radius: 10px; background: {{color}}; color: #FFFFFF; font-size: 13px; font-weight: 600">Approve</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="bot-name" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Name</label><input id="bot-name" type="text" value="Accountant" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717; min-width: 0"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="bot-handle" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Handle</label><div style="display: flex; align-items: center; height: 50px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D9D6D0; border-radius: 12px"><span aria-hidden="true" style="font-size: 16px; color: #5C5C5C">@</span><input id="bot-handle" type="text" value="accountant" style="flex-grow: 1; min-width: 0; width: 60px; height: 46px; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #171717"><svg role="img" aria-label="Handle is free" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex-shrink: 0; color: #1F7A4D"><path d="M20 6L9 17l-5-5"></path></svg></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 500; color: #5C5C5C">Avatar</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F6F5F2">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 44px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; background: {{t.bg}}; color: {{t.ink}}; font-weight: {{t.weight}}; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>
<div style="height: 104px">
<sc-if value="{{isIcon}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><sc-for list="{{icons}}" as="ic" hint-placeholder-count="12"><button type="button" aria-label="{{ic.label}}" aria-pressed="{{ic.pressed}}" onClick="{{ic.pick}}" style="height: 48px; border: {{ic.border}}; border-radius: 12px; background: #FFFFFF; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="{{ic.d}}"></path></svg></button></sc-for></div></sc-if>
<sc-if value="{{isEmoji}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><sc-for list="{{emojis}}" as="em" hint-placeholder-count="12"><button type="button" aria-label="{{em.label}}" aria-pressed="{{em.pressed}}" onClick="{{em.pick}}" style="height: 48px; border: {{em.border}}; border-radius: 12px; background: #FFFFFF; font-size: 22px; padding: 0">{{em.emoji}}</button></sc-for></div></sc-if>
<sc-if value="{{isImage}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; gap: 14px; height: 104px; box-sizing: border-box; padding: 0 14px; border: 1px solid #E4E2DD; border-radius: 14px"><div aria-hidden="true" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; overflow: hidden"><svg viewBox="0 0 48 48" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="48" height="48" fill="#F1DFB8"></rect><circle cx="33" cy="16" r="7" fill="#E6A93C"></circle><path d="M0 34l12-12 10 9 8-6 18 14v9H0z" fill="#7C9A74"></path><path d="M0 40l14-9 12 7 10-5 12 8v7H0z" fill="#4E7A62"></path></svg></div><div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 500">hills.jpg</span><span style="font-size: 13px; color: #5C5C5C">Cropped to a square</span></div><button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #171717; border-radius: 12px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Change photo</button></div></sc-if>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; font-weight: 500; color: #5C5C5C">Color</span><span style="font-size: 13px; color: #5C5C5C">Used in this bot's threads</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; justify-items: center">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="10">
<button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: {{c.hex}}; box-shadow: {{c.ring}}; padding: 0"></button>
</sc-for>
</div>
</div>
<span style="margin-top: auto; font-size: 13px; line-height: 19px; color: #5C5C5C">Avatar and color are separate settings: a photo can sit on a green thread.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var mode = st.mode || 'image';
var iconSel = st.icon || 0;
var emojiSel = st.emoji || 0;
var colorSel = st.color === undefined ? 3 : st.color;
var iconData = [
['Receipt', 'M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6'],
['Compass', 'M12 3a9 9 0 100 18 9 9 0 000-18z M15.5 8.5l-2 5-5 2 2-5z'],
['Search', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4'],
['Code', 'M8 7l-5 5 5 5 M16 7l5 5-5 5 M13.5 5l-3 14'],
['Calendar', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Note', 'M7 3h7l5 5v13H7z M14 3v5h5'],
['Mail', 'M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z M3 7l9 6 9-6'],
['Folder', 'M3 7h6l2 2h10v10H3z'],
['Chart', 'M4 20V10 M10 20V4 M16 20v-7 M21 20H3'],
['Globe', 'M12 3a9 9 0 100 18 9 9 0 000-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18'],
['Bolt', 'M13 3L5 14h6l-1 7 8-11h-6z'],
['Clock', 'M12 3a9 9 0 100 18 9 9 0 000-18z M12 7v5l3 2']
];
var emojiData = [['🧾', 'Receipt'], ['🧮', 'Abacus'], ['💼', 'Briefcase'], ['📊', 'Chart'], ['📝', 'Memo'], ['🔎', 'Magnifier'], ['🗓️', 'Calendar'], ['💡', 'Idea'], ['🤖', 'Robot'], ['🦊', 'Fox'], ['🐙', 'Octopus'], ['🌿', 'Leaf']];
var colorData = [['Red', '#D4213D', '#FCEBEE'], ['Orange', '#B45309', '#FBEDE2'], ['Amber', '#8A5A00', '#FBF3E2'], ['Green', '#1F7A4D', '#EEF6F1'], ['Teal', '#0F766E', '#E6F4F2'], ['Sky', '#0369A1', '#E6F2F9'], ['Blue', '#1F5FBF', '#EAF1FB'], ['Violet', '#5B3FB5', '#F0ECFA'], ['Pink', '#B4236B', '#FBEAF2'], ['Graphite', '#171717', '#EEECE8']];
var tabs = [['Icon', 'icon'], ['Emoji', 'emoji'], ['Image', 'image']].map(function (t) {
var on = t[1] === mode;
return { label: t[0], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#171717' : '#5C5C5C', weight: on ? 600 : 500, shadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none', pick: function () { self.setState({ mode: t[1] }); } };
});
var icons = iconData.map(function (it, i) {
return { label: it[0], d: it[1], pressed: i === iconSel ? 'true' : 'false', border: i === iconSel ? '2px solid #171717' : '1px solid #D9D6D0', pick: function () { self.setState({ icon: i }); } };
});
var emojis = emojiData.map(function (it, i) {
return { emoji: it[0], label: it[1], pressed: i === emojiSel ? 'true' : 'false', border: i === emojiSel ? '2px solid #171717' : '1px solid #D9D6D0', pick: function () { self.setState({ emoji: i }); } };
});
var colors = colorData.map(function (it, i) {
return { label: it[0], hex: it[1], pressed: i === colorSel ? 'true' : 'false', ring: i === colorSel ? '0 0 0 2px #FFFFFF, 0 0 0 4px #171717' : 'none', pick: function () { self.setState({ color: i }); } };
});
return { tabs: tabs, icons: icons, emojis: emojis, colors: colors, color: colorData[colorSel][1], tint: colorData[colorSel][2], colorName: colorData[colorSel][0], isIcon: mode === 'icon', isEmoji: mode === 'emoji', isImage: mode === 'image', previewD: iconData[iconSel][1], previewEmoji: emojiData[emojiSel][0] };
}
}
</script>
</body>
</html>
