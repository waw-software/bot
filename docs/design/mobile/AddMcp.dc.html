<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect by MCP URL</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Connectors.dc.html" aria-label="Back to connectors" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">Connect by MCP URL</h1>
</div>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5C5C5C">For your WAW apps and any server that speaks MCP. Each app has its own address.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mcp-name" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Name</label>
<input id="mcp-name" type="text" value="WAW Notes" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mcp-url" style="font-size: 13px; font-weight: 500; color: #5C5C5C">MCP URL</label>
<input id="mcp-url" type="url" value="https://notes.example.com/mcp" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #5C5C5C">Sign-in</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F6F5F2">
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; color: #5C5C5C; font-family: inherit; font-size: 15px; font-weight: 500">None</button>
<button type="button" aria-pressed="true" style="height: 44px; border: none; border-radius: 10px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">Token</button>
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; color: #5C5C5C; font-family: inherit; font-size: 15px; font-weight: 500">OAuth</button>
</div>
<label for="mcp-token" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Access token</label>
<input id="mcp-token" type="password" value="waw-notes-token" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #EEF6F1">
<div style="display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
<span style="font-size: 14px; font-weight: 600; color: #1B6943">Server answered · 7 tools found</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
<span style="padding: 5px 9px; border-radius: 8px; background: #FFFFFF; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #171717">{{t.name}}</span>
</sc-for>
</div>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 52px; border: 1px solid #D9D6D0; border-radius: 14px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 500">Test again</button>
<a href="Connectors.dc.html" style="height: 52px; border-radius: 14px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Add connector</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var tools = ['search_notes', 'get_note', 'create_note', 'append_to_note', '+3 more'].map(function (name) { return { name: name }; });
return { tools: tools };
}
}
</script>
</body>
</html>
