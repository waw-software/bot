# Builds the Bot server, client and desktop app, then runs the Playwright smoke
# (scripts/env.sh e2e): GET /health and the Electron shell, under xvfb. The failure artifact
# holds the Playwright output.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: setup
        run: scripts/env.sh setup

      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: e2e
        run: xvfb-run -a scripts/env.sh e2e
        env:
          CI: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: packages/e2e/out/playwright
